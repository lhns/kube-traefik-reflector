{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-traefik-reflector.fullname" . }}
  labels:
    {{- include "kube-traefik-reflector.labels" . | nindent 4 }}
rules:
  # The Traefik "policy" CRDs we mirror.
  - apiGroups: ["traefik.io"]
    resources:
      - middlewares
      - middlewaretcps
      - tlsoptions
      - serverstransports
      - serverstransporttcps
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Namespaces: resolve targets and watch for new/relabelled ones.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Secrets: existence checks only (the controller reads metadata, never data).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Emit warning Events on source objects.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-traefik-reflector.fullname" . }}
  labels:
    {{- include "kube-traefik-reflector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-traefik-reflector.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-traefik-reflector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kube-traefik-reflector.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-traefik-reflector.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kube-traefik-reflector.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-traefik-reflector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kube-traefik-reflector.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-traefik-reflector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
