name: release

# push to main   -> image :sha-<short> + dev Helm chart (single-arch)
# tag vX.Y.Z     -> image :X.Y.Z + :latest (multi-arch), signed + SBOM, OCI Helm
#                   chart X.Y.Z, and a GitHub Release from the CHANGELOG section.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create GitHub Releases
  packages: write # push image + chart to GHCR
  id-token: write # cosign keyless signing

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kube-traefik-reflector
  CHART_OCI: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and mode
        id: v
        run: |
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            {
              echo "mode=release"
              echo "version=${VER}"
              echo "chartVersion=${VER}"
              echo "platforms=linux/amd64,linux/arm64"
              echo "tags=${IMAGE}:${VER},${IMAGE}:latest"
            } >> "$GITHUB_OUTPUT"
          else
            SHA="$(git rev-parse --short HEAD)"
            {
              echo "mode=dev"
              echo "version=0.0.0-dev.${SHA}"
              echo "chartVersion=0.0.0-dev.${SHA}"
              echo "platforms=linux/amd64"
              echo "tags=${IMAGE}:sha-${SHA}"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.v.outputs.platforms }}
          push: true
          tags: ${{ steps.v.outputs.tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.v.outputs.date }}

      - name: Sign image and attach SBOM (release only)
        if: steps.v.outputs.mode == 'release'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SBOM
        if: steps.v.outputs.mode == 'release'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest SBOM
        if: steps.v.outputs.mode == 'release'
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Package and push Helm chart
        run: |
          set -euo pipefail
          helm package charts/kube-traefik-reflector \
            --version "${{ steps.v.outputs.chartVersion }}" \
            --app-version "${{ steps.v.outputs.version }}"
          helm push "kube-traefik-reflector-${{ steps.v.outputs.chartVersion }}.tgz" "${CHART_OCI}"

      - name: GitHub Release from CHANGELOG (release only)
        if: steps.v.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.v.outputs.version }}"
          awk -v v="$VER" '
            index($0, "## [" v "]") == 1 { p=1; next }
            p && index($0, "## [") == 1 { exit }
            p { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
